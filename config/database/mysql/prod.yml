# 生产环境：三个业务库位于同一 RDS 实例，与 dev、test 环境隔离。
# ${...} 是环境变量占位符；加载器须显式展开字符串字段，缺失或为空时拒绝启动。
# 初始化组件应用 TLS、每个物理连接的会话参数及 GORM NowFunc，并校验实际连接。
# 所有超时、连接寿命、空闲时间和 SlowThreshold 均以秒计。
# 连接池为单进程、单业务连接的初始参考值；实例额度须覆盖所有应用副本及运维连接。
# 除三个普通业务连接外，transaction 使用独立权限配置，池容量先与本环境普通池保持一致。
# 当前四个池各最多 20 个连接，合计最多 80 个连接/进程，不表示启动时预建全部连接。
Gormv2:
  Mysql:
    Connections:
      user: &connection
        Enabled: true
        IsOpenReadDb: false # 当前未配置只读实例，全部查询使用主库。
        SlowThreshold: 1
        LogLevel: "warn"
        Behavior:
          SkipDefaultTransaction: false
          PrepareStmt: false
          SuppressRecordNotFound: false
          TranslateError: false
          SingularTable: true
          DisableForeignKeyConstraintWhenMigrating: true
          AutoMigrate: false
          NowFunc:
            Location: "UTC"
            Precision: "millisecond"
        Write: &writer
          Host: "${PROD_MYSQL_HOST}"
          Port: 3306
          DataBase: "user_service"
          User: "${PROD_MYSQL_USER_USERNAME}"
          Pass: "${PROD_MYSQL_USER_PASSWORD}"
          Charset: "utf8mb4"
          Collation: "utf8mb4_0900_bin"
          ParseTime: true
          Loc: "UTC"
          MultiStatements: false
          Session:
            TimeZone: "+00:00"
            TransactionIsolation: "READ-COMMITTED"
            Autocommit: 1
            SQLMode: "ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"
          TLS:
            Enabled: true
            CAFile: "${PROD_MYSQL_CA_FILE}"
            ServerName: "${PROD_MYSQL_HOST}"
            MinVersion: "1.2"
            InsecureSkipVerify: false
            AllowFallbackToPlaintext: false
          SetMaxOpenConns: 20
          SetMaxIdleConns: 5
          SetConnMaxLifetime: 180
          SetConnMaxIdleTime: 60
          ConnectTimeout: 5
          ReadTimeout: 10
          WriteTimeout: 10
      # 复用连接行为及主库参数，按业务库覆盖库名与账号；账号仅授予本库所需权限。
      post:
        <<: *connection
        Write:
          <<: *writer
          DataBase: "post_service"
          User: "${PROD_MYSQL_POST_USERNAME}"
          Pass: "${PROD_MYSQL_POST_PASSWORD}"
      order:
        <<: *connection
        Write:
          <<: *writer
          DataBase: "order_service"
          User: "${PROD_MYSQL_ORDER_USERNAME}"
          Pass: "${PROD_MYSQL_ORDER_PASSWORD}"
      # 通用事务池只在本环境同一 RDS 主实例、账号获准权限相容的流程之间复用。
      # 目标表均须使用 InnoDB；跨实例操作不能通过共享池或分别 Begin 获得本地事务原子性。
      transaction:
        <<: *connection
        Write:
          # 复用主库地址、UTC 会话、CA 与服务器身份校验及超时，继续强制 TLS。
          <<: *writer
          # 不设置默认库，所有 SQL 必须完整指定 库名.表名，不通过 USE 改变池会话状态。
          DataBase: ""
          # 注入生产环境获准跨库账号；按实例和实际流程所需目标表、操作设置最小权限。
          # 不复用开发密码或其他环境账号；变量缺失或为空时拒绝启动，不自动创建或授权账号。
          User: "${PROD_MYSQL_TRANSACTION_USERNAME}"
          Pass: "${PROD_MYSQL_TRANSACTION_PASSWORD}"
          # 本连接单独建池；每次 Begin 都是独立事务，也不会与普通业务池的事务自动合并。
          # 容量先与本环境普通池保持一致，后续按事务负载、应用副本数和实例额度调整。
          # 同次事务的操作传递同一个 tx，最终统一 Commit/Rollback，不能跨实例或越权使用。
          SetMaxOpenConns: 20
          SetMaxIdleConns: 5

# 本地开发 MySQL 配置：三个业务库共用 127.0.0.1:3306 和本地 root 账号。
# 本机回环连接显式关闭 TLS，不需要 CA 文件或 DEV_MYSQL_CA_FILE 环境变量。
# test、prod 的 TLS 配置独立维护，不受本文件影响。
#
# 加载流程：选择 dev.yml -> 解析 YAML 并合并锚点 -> 校验配置 -> 配置驱动、会话、连接池和 GORM。
# 初始化组件逐项应用下列配置，并在所有启用连接校验成功后启动 HTTP 服务。
# 其他环境的 ${...} 占位符须在 YAML 解码后显式展开，缺失或为空时拒绝启动。
#
# 命名连接：user -> user_service，post -> post_service，order -> order_service。
# 仓储必须明确选择连接，程序不会根据模型所在目录自动选库；库表须预先通过 SQL 创建。
# 三个连接复用配置内容，但各自拥有连接池；同一实例、同一账号不代表共用一个事务。
# 多步骤业务操作仍须显式使用同一个事务，不能依赖下面的默认事务开关自动串联。
#
# 所有超时、连接寿命、空闲时间和 SlowThreshold 均以秒计；连接数没有时间单位。
# 连接池参数为单进程、单业务连接的初始参考值，须按实例额度、应用副本数和压测调整。
# 网络超时不等于完整 SQL 或 HTTP 请求的总时限，完整操作仍须使用 context 控制。

# Gormv2、Mysql、Connections 是项目约定的配置分组，由项目加载器解释。
Gormv2:
  Mysql:
    Connections:
      # &connection 将整段 user 连接配置命名，供 post、order 通过 *connection 复用。
      user: &connection
        # 启用这个命名连接配置。
        Enabled: true
        # 不启用读写分离：查询和写入均使用 Write；改为 true 前须补齐完整的 Read 配置。
        IsOpenReadDb: false
        # 耗时超过 1 秒的 SQL 按慢查询记录，不会因此自动取消执行。
        SlowThreshold: 1
        # 记录警告、慢 SQL 和错误，不逐条打印正常 SQL。
        LogLevel: "warn"
        # 项目初始化组件将这些声明映射为 GORM 选项或项目封装行为。
        Behavior:
          # false：保留 GORM 普通新增、更新、删除操作的默认事务；不覆盖整个业务流程。
          SkipDefaultTransaction: false
          # false：不启用 GORM 的预处理语句缓存；驱动仍可能使用预处理语句。
          PrepareStmt: false
          # 项目封装开关；false：保留 First、Take、Last 查不到记录时的 ErrRecordNotFound。
          # 它不控制日志；Find 得到空列表也不能一概按该错误处理。
          SuppressRecordNotFound: false
          # false：保留 MySQL 驱动错误，不转换为 GORM 通用错误，便于判断 1062 等错误码。
          TranslateError: false
          # 自动推导表名时使用单数，如 UserProfile -> user_profile；模型的 TableName() 优先。
          SingularTable: true
          # GORM 建表、迁移时不自动创建物理外键；不删除已有外键，也不约束手写 SQL。
          DisableForeignKeyConstraintWhenMigrating: true
          # 项目启动不调用自动建表、改表；实际结构通过受控 SQL 迁移维护。
          AutoMigrate: false
          # 加载器将此配置组装为 time.Now().UTC().Truncate(time.Millisecond) 时间函数。
          # 用于 GORM 自动维护 CreatedAt、UpdatedAt；手动传入的事件时间仍须自行转换、对齐。
          NowFunc:
            # 自动生成时间使用 UTC。
            Location: "UTC"
            # 截断到毫秒，如 .123456 -> .123。
            Precision: "millisecond"
        # Write 是主库端点，当前也承担查询；&writer 将端点参数命名以便复用。
        Write: &writer
          # 本机 TCP 地址。
          Host: "127.0.0.1"
          # MySQL 监听端口。
          Port: 3306
          # 默认数据库；该连接访问未限定库名的 user_profile 时，实际为 user_service.user_profile。
          DataBase: "user_service"
          # MySQL 登录账号；本地三个业务库共用 root。
          User: "root"
          # MySQL 登录密码。
          Pass: "MySQL@123456"
          # 连接字符集，支持完整 Unicode；不会转换已有库表字段。
          Charset: "utf8mb4"
          # 连接比较规则，区分大小写等字符差异；已有字符列仍以其实际定义为准。
          Collation: "utf8mb4_0900_bin"
          # 将 DATE、DATETIME 等时间列解析为 Go 时间类型。
          ParseTime: true
          # 驱动按 UTC 处理 Go 时间；此项不会设置 MySQL 会话时区。
          Loc: "UTC"
          # 一次调用不允许发送多条 SQL；显式事务内仍可分多次执行。
          MultiStatements: false
          # 每个新建物理连接都须设置这些会话值，不能只在启动时随便取一个连接设置一次。
          # 此处是原始配置值，初始化组件负责驱动参数的正确引用和转义。
          Session:
            # MySQL 会话使用 UTC，影响当前时间函数等行为；不会把已有 DATETIME 自动转换为 UTC。
            TimeZone: "+00:00"
            # 读已提交：普通读取不读未提交数据，同一事务内两次普通查询可能读到不同结果。
            TransactionIsolation: "READ-COMMITTED"
            # 没有显式事务时，普通语句自动提交；仍允许应用显式开启 sql.Tx。
            Autocommit: 1
            # ONLY_FULL_GROUP_BY：阻止取值不确定的分组查询。
            # STRICT_TRANS_TABLES：普通写入中的超长、越界等非法值及时报错。
            # NO_ZERO_IN_DATE、NO_ZERO_DATE：结合严格模式，拒绝月日为零的日期及零日期。
            # ERROR_FOR_DIVISION_BY_ZERO：结合严格模式，对写入中的除零报错。
            # NO_ENGINE_SUBSTITUTION：指定引擎不可用时报错，不自动替换。
            SQLMode: "ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"
          # 本地回环连接的 TLS 例外；初始化组件须按 Enabled 分支决定是否构建 TLS 配置。
          TLS:
            # false：直接使用本地非 TLS 连接，不加载 CA、不校验证书相关字段。
            Enabled: false
            # 关闭 TLS 时留空，不需要环境变量；开启 TLS 时填写可信 CA 证书文件路径。
            CAFile: ""
            # 以下参数仅开启 TLS 时使用；ServerName 应与实际连接地址及证书匹配。
            ServerName: "127.0.0.1"
            # 开启 TLS 时最低允许 1.2，也允许更高版本。
            MinVersion: "1.2"
            # 开启 TLS 时保留证书链、有效期和服务器身份校验。
            InsecureSkipVerify: false
            # 禁止 TLS 协商失败后再退回明文；Enabled=false 的本地直连不属于这种回退。
            AllowFallbackToPlaintext: false
          # 每个池最多打开 10 个连接，包含使用中和空闲连接；达到上限后等待可用连接。
          # 三个池合计最多 30 个连接/进程，不表示启动就预建 30 个连接。
          SetMaxOpenConns: 10
          # 每个池最多保留 2 个空闲连接，包含在上述 10 个连接中，不是额外增加。
          SetMaxIdleConns: 2
          # 连接使用满 180 秒后安排回收，不因此直接打断正在执行的操作。
          SetConnMaxLifetime: 180
          # 连接持续空闲达到 60 秒后可以被回收。
          SetConnMaxIdleTime: 60
          # TCP 建连超时 5 秒。
          ConnectTimeout: 5
          # 从 MySQL 接收数据的网络 I/O 超时 10 秒，不是整个请求的总时限。
          ReadTimeout: 10
          # 向 MySQL 发送数据的网络 I/O 超时 10 秒。
          WriteTimeout: 10
      # <<: *connection 合并整段连接参数；本地开发只覆盖默认库名。
      # Write 会覆盖继承的同名配置组，因此其内部还要合并 *writer，保留地址、账号等参数。
      post:
        <<: *connection
        Write:
          <<: *writer
          # post 命名连接默认访问帖子库，其他配置与 user 相同，但连接池独立。
          DataBase: "post_service"
      order:
        <<: *connection
        Write:
          <<: *writer
          # order 命名连接默认访问订单库，其他配置与 user 相同，但连接池独立。
          DataBase: "order_service"

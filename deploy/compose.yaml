# 与 environments/ 下的一份环境配置合并使用。应用镜像和 APP_ENV 由环境文件提供。
services:
  app:
    restart: unless-stopped
    # Go HTTP 和内部任务使用各自的进程收尾流程，留出处理 SIGTERM 的时间。
    stop_grace_period: 20s
    environment:
      APP_REGION: cn
      # 已结束的 Span 通过本项目的 Compose 网络发给 Agent。
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://log-agent:4318/v1/traces
    ports:
      # 映射顺序为「宿主机地址:宿主机端口:容器端口」。Go 在容器里监听 8080。
      # GO_BIND_ADDRESS=0.0.0.0 将 GO_HTTP_PORT 发布到宿主机的所有 IPv4 网卡。
      # 其他机器使用宿主机实际可达的 IP 或域名及 GO_HTTP_PORT 访问。
      # 跨机器访问还取决于路由、宿主机防火墙和云安全组是否允许该端口。
      # 需要限制访问范围时，可以填具体网卡的 IP，或用 127.0.0.1 只开放给宿主机本机。
      - "${GO_BIND_ADDRESS:-0.0.0.0}:${GO_HTTP_PORT:-8080}:8080"
    volumes:
      # 三套环境共用项目根目录的 config/。路径相对于 deploy/，Go 根据 APP_ENV 选择 YAML。
      - type: bind
        source: ../config
        target: /app/config
        read_only: true
        bind:
          create_host_path: false
      # logger YAML 的 file_path 相对于应用工作目录 /app，写入这个共享卷。
      - go-logs:/app/.data/logs

  log-agent:
    image: otel/opentelemetry-collector-contrib:0.155.0
    command: ["--config=/etc/otelcol-contrib/go-logs.yaml"]
    restart: unless-stopped
    # Agent 在 app 启动后读取共享卷中的日志，并通过内部 OTLP HTTP 接收 Span。
    depends_on:
      app:
        condition: service_started
    # user 的格式是「用户 ID:用户组 ID」。0:0 让 Agent 以容器内的 root 用户和 root 组运行。
    # 官方 Agent 镜像默认用 10001:10001。这里指定 0:0 是为了写入新建的状态卷，
    # 该卷挂载在 /var/lib/otelcol，初始归 root 所有。Agent 的 file_storage 在里面
    # 保存各日志文件的读取位置，重启后可以接着读。换成普通用户时，须先给该用户写入权限。
    user: "0:0"
    # Linux capabilities 是进程可以获得的额外权限。ALL 移除 Docker 分配的全部 capabilities。
    # 例如移除 CAP_DAC_OVERRIDE 后，即便进程的 UID 为 0，读取其他用户的文件仍须遵守文件权限。
    # Agent 作为状态卷目录的所有者，仍能写入采集进度。它通过文件的读权限读取应用日志，
    # 应用日志卷本身以只读方式挂载。向中心 Collector 发送 HTTP 请求也只需要普通权限。
    cap_drop: [ALL]
    environment:
      # 日志和 Span 共用中心 Collector 的基础地址和该中心的 token。
      GO_LOG_OTLP_ENDPOINT: ${GO_LOG_OTLP_ENDPOINT:?请设置中心 Collector 的 OTLP HTTP 基础地址}
      OTLP_AUTH_TOKEN: ${OTLP_AUTH_TOKEN:?请从启动环境提供中心 Collector 使用的 OTLP_AUTH_TOKEN}
    volumes:
      - ./collector/otelcol-go-logs.yaml:/etc/otelcol-contrib/go-logs.yaml:ro
      - type: volume
        source: go-logs
        target: /app/.data/logs
        read_only: true
        volume:
          nocopy: true
      - log-agent-state:/var/lib/otelcol

volumes:
  go-logs:
  log-agent-state:
